[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafwright"
version = "0.5.0"
description = "Lightweight cross-platform GUI PDF editor (text, shapes, pages, PDF/A & PDF/X export)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leafwright contributors" }]
dependencies = [
    "PyMuPDF>=1.24",
    "pikepdf>=8.0",
    "PySide6-Essentials>=6.5",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leafwright = "leafwright.app:main"

[project.gui-scripts]
leafwright-gui = "leafwright.app:main"

[tool.setuptools.packages.find]
include = ["leafwright*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
