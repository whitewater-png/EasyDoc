[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafweaving"
version = "0.6.0"
description = "Lightweight cross-platform GUI PDF editor (text, shapes, pages, PDF/A & PDF/X export)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leafweaving contributors" }]
dependencies = [
    "PyMuPDF>=1.24",
    "pikepdf>=8.0",
    "PySide6-Essentials>=6.5",
    "certifi",
]

[project.urls]
Homepage = "https://github.com/whitewater-png/Leafweaving"
Source = "https://github.com/whitewater-png/Leafweaving"
Releases = "https://github.com/whitewater-png/Leafweaving/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leafweaving = "leafweaving.app:main"

[project.gui-scripts]
leafweaving-gui = "leafweaving.app:main"

[tool.setuptools.packages.find]
include = ["leafweaving*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
