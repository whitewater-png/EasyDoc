name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that publishes the release may write.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "release/*.zip"
          - os: macos-latest        # Apple Silicon
            artifact: "release/*.dmg"
          - os: ubuntu-22.04
            artifact: "release/*.tar.gz"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/constraints.txt -e . pyinstaller
      - name: Build bundle
        run: python packaging/build.py
      - name: Smoke test bundle (Linux, on the build host)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/dist/leafweaving/leafweaving --help
      - name: Smoke test bundle in a bare ubuntu:22.04 with only the documented packages
        if: runner.os == 'Linux'
        run: |
          PKGS=$(grep -v '^#' packaging/linux-runtime-packages.txt | tr '\n' ' ')
          docker run --rm -v "$PWD/build/dist:/d:ro" -e QT_QPA_PLATFORM=offscreen ubuntu:22.04 bash -euxc \
            "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS >/dev/null && /d/leafweaving/leafweaving --help"
      - name: License texts are in the bundle
        shell: bash
        run: |
          test -f build/LICENSES/NOTICE.txt
          test -f build/LICENSES/AGPL-3.0.txt
          test -f build/LICENSES/LGPL-3.0.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: leafweaving-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: List of native libraries in the bundle (license bookkeeping)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: binaries-${{ matrix.os }}
          path: build/BINARIES.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: leafweaving-*
          path: artifacts
          merge-multiple: true
      - name: Corresponding source of bundled copyleft components (AGPL / LGPL)
        run: python3 packaging/fetch_sources.py artifacts
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
